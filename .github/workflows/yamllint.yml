name: yamllint
on: [push]
jobs:
  yamllint:
    name: runner / yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
      - name: yamllint
        uses: reviewdog/action-yamllint@v1.26.0
        with:
          github_token: ${{ secrets.github_token }}
